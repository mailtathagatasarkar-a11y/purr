name: Build Purr

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Mac builds to (e.g. v0.1.1)
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows-x64
          - os: macos-latest
            script: dist:mac:arm64
            name: mac-arm64
          - os: macos-15-intel
            script: dist:mac:x64
            name: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds. Add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID for notarizing) to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: purr-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      # The Windows installer on releases is built and tested locally; CI adds the Mac builds.
      - name: Attach Mac builds to the release
        if: (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && startsWith(matrix.os, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
